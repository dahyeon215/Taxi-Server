name: Server CI

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & lint
        run: |
          pip install -r requirements.txt
          # flake8, pytest 등을 추가했다면 여기에 실행

      - name: Build Docker image
        run: |
          docker build . --tag taxi-server:ci
